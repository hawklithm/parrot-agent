[package]
name = "parrot-server"
version = "0.1.0"
edition = "2021"
default-run = "parrot-server"

[lib]
name = "parrot_server"
path = "src/lib.rs"

[[bin]]
name = "parrot-server"
path = "src/main.rs"

[dependencies]
api = { path = "../api" }
models = { path = "../models" }
services = { path = "../services" }
repositories = { path = "../repositories" }
access = { path = "../access" }

axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dotenvy = "0.15"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sd-notify = "0.3"

[dev-dependencies]
async-trait = { workspace = true }
tower = { version = "0.5", features = ["util"] }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
