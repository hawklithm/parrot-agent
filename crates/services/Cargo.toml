[package]
name = "services"
version = "0.1.0"
edition = "2021"

[features]
# Kept opt-in until the legacy unit-test fixtures are migrated to the current
# repository traits and models.
legacy-unit-tests = []

[dependencies]
models = { path = "../models" }
repositories = { path = "../repositories" }
access = { path = "../access" }
uuid = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
futures = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
sha2 = "0.10"
hex = "0.4"
tokio = { workspace = true }
cron = "0.12"
chrono-tz = "0.8"
aes-gcm = "0.10"
rand = "0.8"
regex = "1.10"
csv = "1.3"
axum = { workspace = true }
base64 = "0.22"
hmac = "0.12"
jwt = "0.16"
dashmap = "5.5"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
	urlencoding = "2.1"
	ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
	pkcs8 = { version = "0.10", features = ["pem"] }
nix = { version = "0.31.3", features = ["signal"] }
unicode-segmentation = "1.10"
parking_lot = "0.12"
sysinfo = "0.30"

tempfile = "3.8"
