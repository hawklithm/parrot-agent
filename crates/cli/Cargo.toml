[package]
name = "parrot-cli"
version = "0.1.0"
edition = "2021"
description = "Parrot command-line client"
license = "MIT"

[[bin]]
name = "parrot"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
