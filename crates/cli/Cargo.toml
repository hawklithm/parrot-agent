[package]
name = "parrot-cli"
version = "0.1.0"
edition = "2021"
description = "Parrot command-line client"
license = "MIT"

[lib]
name = "parrot_cli_lib"
path = "src/lib.rs"

[[bin]]
name = "parrot"
path = "src/bin/parrot.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
regex = "1.10"
uuid = { workspace = true }
libc = "0.2"
sqlx = { workspace = true }
tokio = { workspace = true }

services = { path = "../services" }

[dev-dependencies]
tempfile = "3"
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
regex = "1.10"
